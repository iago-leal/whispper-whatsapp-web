[project]
name = "whispper-motor"
version = "1.1.0"
description = "Motor de transcrição local do whispper-whatsapp-web (aplicativo auxiliar do Chrome e do Brave)"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper; sys_platform == 'darwin'",
    "faster-whisper>=1.2,<1.3; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real: exige o modelo Whisper real no cache local; rode com MOTOR_REAL=1",
]
